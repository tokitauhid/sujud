<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/icon-512.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=0"
    />
    <meta name="theme-color" content="#121315" />
    <meta name="description" content="Sujud — Track your daily Salah, streaks, and prayer times. Open-source, ad-free, and privacy-first." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Sujud</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("sujud_theme");
          if (!t) {
            t = "dark";
          }
          var resolved = t;
          if (t === "system") {
            resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (resolved === "oled") {
            document.documentElement.classList.add("dark", "oled");
            if (meta) meta.setAttribute("content", "#000000");
          } else if (resolved === "dark") {
            document.documentElement.classList.add("dark");
            if (meta) meta.setAttribute("content", "#121315");
          } else if (resolved === "light") {
            document.documentElement.classList.add("light");
            if (meta) meta.setAttribute("content", "#FAF7F4");
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
