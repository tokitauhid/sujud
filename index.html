<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/icon-512.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=0"
    />
    <meta name="theme-color" content="#0B0D11" />
    <meta name="description" content="Sujud — Track your daily Salah, streaks, and prayer times. Open-source, ad-free, and privacy-first." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Sujud</title>
    <link rel="preload" as="video" href="/assets/onboarding_intro.mp4" type="video/mp4" />
    <style>
      :root {
        --app-bg: #0B0D11;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000 !important;
      }
      html.dark, html.dark body, body.dark {
        --app-bg: #0B0D11;
        background-color: #000000 !important;
      }
      html.dark.oled, html.dark.oled body, body.dark.oled, body.oled {
        --app-bg: #000000;
        background-color: #000000 !important;
      }
      html.light, html.light body, body.light {
        --app-bg: #FAF7F4;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: #000000;
      }
      #sujud-initial-shell {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        user-select: none;
        -webkit-user-select: none;
      }
      html.oled #sujud-initial-shell, body.oled #sujud-initial-shell {
        background-color: #000000;
      }
      /* Prevent native video player controls and playback icon flash */
      video::-webkit-media-controls,
      video::-webkit-media-controls-enclosure,
      video::-webkit-media-controls-panel,
      video::-webkit-media-controls-play-button,
      video::-webkit-media-controls-start-playback-button,
      video::-webkit-media-controls-overlay-play-button {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        -webkit-appearance: none !important;
        pointer-events: none !important;
      }
      *::-webkit-media-controls-overlay-play-button {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("sujud_theme") || "dark";
          var resolved = t;
          if (t === "system") {
            resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          var bg = "#0B0D11";
          if (resolved === "oled") {
            bg = "#000000";
            document.documentElement.className = "dark oled";
            if (meta) meta.setAttribute("content", "#000000");
          } else if (resolved === "light") {
            bg = "#FAF7F4";
            document.documentElement.className = "light";
            if (meta) meta.setAttribute("content", "#0B0D11");
          } else {
            bg = "#0B0D11";
            document.documentElement.className = "dark";
            if (meta) meta.setAttribute("content", "#0B0D11");
          }
          document.documentElement.style.setProperty("--app-bg", bg);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="dark">
    <script>
      (function() {
        try {
          var t = localStorage.getItem("sujud_theme") || "dark";
          var resolved = t;
          if (t === "system") {
            resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (resolved === "oled") {
            document.body.className = "dark oled";
          } else if (resolved === "light") {
            document.body.className = "light";
          } else {
            document.body.className = "dark";
          }
        } catch(e) {}
      })();
    </script>
    <div id="root">
      <div id="sujud-initial-shell" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
