<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/icon-512.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=0"
    />
    <meta name="theme-color" content="#0B0D11" />
    <meta name="description" content="Sujud — Track your daily Salah, streaks, and prayer times. Open-source, ad-free, and privacy-first." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Sujud</title>
    <link rel="preload" as="image" href="/assets/loading_sprites/frame-001.webp" type="image/webp" />
    <link rel="preload" as="image" href="/assets/loading_sprites/sujud-logo.webp" type="image/webp" />
    <style>
      :root {
        --app-bg: #0B0D11;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0B0D11;
      }
      html.dark, html.dark body, body.dark {
        --app-bg: #0B0D11;
        background-color: #0B0D11 !important;
      }
      html.dark.oled, html.dark.oled body, body.dark.oled, body.oled {
        --app-bg: #000000;
        background-color: #000000 !important;
      }
      html.light, html.light body, body.light {
        --app-bg: #FAF7F4;
        background-color: #FAF7F4 !important;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: var(--app-bg);
      }
      #sujud-initial-shell {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--app-bg);
        user-select: none;
        -webkit-user-select: none;
      }
      #sujud-initial-shell .sujud-initial-stage {
        position: relative;
        width: 16rem;
        height: 16rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @media (min-width: 640px) {
        #sujud-initial-shell .sujud-initial-stage {
          width: 18rem;
          height: 18rem;
        }
      }
      @media (min-width: 768px) {
        #sujud-initial-shell .sujud-initial-stage {
          width: 20rem;
          height: 20rem;
        }
      }
      #sujud-initial-shell img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("sujud_theme") || "dark";
          var resolved = t;
          if (t === "system") {
            resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          var bg = "#0B0D11";
          if (resolved === "oled") {
            bg = "#000000";
            document.documentElement.className = "dark oled";
            if (meta) meta.setAttribute("content", "#000000");
          } else if (resolved === "light") {
            bg = "#FAF7F4";
            document.documentElement.className = "light";
            if (meta) meta.setAttribute("content", "#FAF7F4");
          } else {
            bg = "#0B0D11";
            document.documentElement.className = "dark";
            if (meta) meta.setAttribute("content", "#0B0D11");
          }
          document.documentElement.style.setProperty("--app-bg", bg);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="dark">
    <script>
      (function() {
        try {
          var t = localStorage.getItem("sujud_theme") || "dark";
          var resolved = t;
          if (t === "system") {
            resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (resolved === "oled") {
            document.body.className = "dark oled";
          } else if (resolved === "light") {
            document.body.className = "light";
          } else {
            document.body.className = "dark";
          }
        } catch(e) {}
      })();
    </script>
    <div id="root">
      <div id="sujud-initial-shell">
        <div class="sujud-initial-stage">
          <picture>
            <source srcset="/assets/loading_sprites/frame-001.webp" type="image/webp" />
            <img src="/assets/loading_sprites/frame-001.png" alt="Sujud" />
          </picture>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
