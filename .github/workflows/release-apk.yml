name: Build & Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # --------------------------------------------------
      # Node
      # --------------------------------------------------
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # Firebase environment
      # --------------------------------------------------
      - name: Create .env
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env

      - name: Create google-services.json
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      # --------------------------------------------------
      # Build web application
      # --------------------------------------------------
      - name: Build web assets
        run: npm run build

      # --------------------------------------------------
      # Capacitor
      # --------------------------------------------------
      - name: Sync Capacitor
        run: npx cap sync android

      # --------------------------------------------------
      # Setup signing
      # --------------------------------------------------
      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Keystore found. Building signed APK."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No keystore found. Building debug APK."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # --------------------------------------------------
      # Fix Gradle Java Home
      # --------------------------------------------------
      - name: Remove hardcoded org.gradle.java.home
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      # --------------------------------------------------
      # Build signed APK
      # --------------------------------------------------
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # --------------------------------------------------
      # Build debug APK fallback
      # --------------------------------------------------
      - name: Build debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: android
        run: ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      # --------------------------------------------------
      # Find APK
      # --------------------------------------------------
      - name: Find APK
        id: apk
        run: |
          set -e

          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          else
            APK=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "No APK found!"
            exit 1
          fi

          echo "Found APK: $APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Rename APK with version
      # --------------------------------------------------
      - name: Prepare release APK
        id: release_apk
        run: |
          TAG="${GITHUB_REF_NAME}"
          ORIGINAL="${{ steps.apk.outputs.path }}"

          mkdir -p release

          cp "$ORIGINAL" "release/Sujud-${TAG}.apk"

          echo "path=release/Sujud-${TAG}.apk" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Generate Changelog
      # --------------------------------------------------
      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh release create "$TAG" \
            "${{ steps.release_apk.outputs.path }}" \
            --title "Sujud ${TAG}" \
            --notes "${{ steps.build_changelog.outputs.changelog }}" \
            --verify-tag
