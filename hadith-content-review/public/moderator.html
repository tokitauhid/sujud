<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sujud Moderator Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .moderator-shell { width: min(1180px, calc(100% - 32px)); margin: auto; padding: 38px 0 70px; }
      .moderator-header { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 22px; }
      .moderator-header h1 { max-width: 700px; }
      .moderator-auth { display: flex; gap: 8px; min-width: min(430px, 100%); }
      .moderator-auth input { flex: 1; }
      .moderator-stats { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); margin: 14px 0; }
      .moderator-stats strong { color: var(--text); }
      .moderator-card { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 19px; margin: 13px 0; }
      .moderator-card h2 { margin: 0; font-size: 1rem; color: var(--accent); }
      .moderator-card blockquote { margin: 12px 0; white-space: pre-wrap; }
      .moderator-meta { color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: 8px; }
      .moderator-actions { display: flex; flex-wrap: wrap; gap: 9px; align-items: end; margin-top: 15px; }
      .moderator-actions select { min-width: 170px; }
      .review-list { display: grid; gap: 8px; margin-top: 15px; }
      .review-entry { border-left: 2px solid var(--border); padding-left: 12px; color: var(--muted); font-size: .87rem; }
      .review-entry strong { color: var(--text); }
      .moderator-empty { color: var(--muted); padding: 42px 0; text-align: center; }
      .bulk-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 12px; margin: 12px 0; }
      @media (max-width: 720px) { .moderator-shell { width: min(100% - 20px, 640px); } .moderator-header { display: block; } .moderator-auth { margin-top: 18px; } }
    </style>
  </head>
  <body>
    <main class="moderator-shell">
      <header class="moderator-header">
        <div><p class="eyebrow">Private editorial workspace</p><h1>Moderator dashboard</h1><p class="lede">Review community feedback, resolve reports, and approve only content that has passed editorial checks.</p></div>
        <form id="authForm" class="moderator-auth"><input id="token" type="password" placeholder="Moderator token" autocomplete="current-password" required /><button class="button" type="submit">Connect</button></form>
      </header>
      <section id="message" class="message" hidden></section>
      <section id="dashboard" hidden>
        <section class="toolbar"><label class="search-field">Search <input id="search" type="search" placeholder="Text, ID, collection, reference" /></label><label>Show <select id="statusFilter"><option value="all">All candidates</option><option value="community-reviewed">Community reviewed</option><option value="community-review">Community review status</option><option value="needs-moderation">Needs moderation</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></label><button id="refresh" class="button secondary" type="button">Refresh</button><button id="export" class="button" type="button">Export approved</button></section>
        <section class="bulk-actions"><label><input id="selectAll" type="checkbox" /> Select visible</label><label>Status for selected<select id="bulkStatus"><option value="needs-moderation">Needs moderation</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="community-review">Community review</option></select></label><button id="bulkSave" class="button" type="button" disabled>Mass save selected</button></section>
        <div id="stats" class="moderator-stats"></div>
        <section id="candidateList"></section>
      </section>
    </main>
    <script type="module" src="/moderator.js?v=3"></script>
  </body>
</html>
